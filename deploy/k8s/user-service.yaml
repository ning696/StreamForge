apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: streamforge
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: streamforge/user-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: streamforge-secret
                  key: MYSQL_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: streamforge-secret
                  key: MYSQL_PASSWORD
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: streamforge
  labels:
    app: user-service
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 31081

