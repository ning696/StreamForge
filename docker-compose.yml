services:
  mysql:
    image: mysql:8.4
    container_name: streamforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: streamforge
      MYSQL_USER: streamforge
      MYSQL_PASSWORD: streamforge_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - streamforge_mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ustreamforge -pstreamforge_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: streamforge-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - streamforge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    container_name: streamforge-livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "30000-30100:30000-30100/udp"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  streamforge_mysql_data:
  streamforge_redis_data: